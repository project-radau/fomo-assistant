[package]
name = "fomo-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["form", "json", "rustls", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
scraper = "0.27.0"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
url = "2"
futures = "0.3.34"
