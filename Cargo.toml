[package]
name = "fomo-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["form", "json", "rustls", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
